<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Player — SignBridge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body class="page-player" data-job-id="{{ job_id }}">
    <header class="topbar">
      <div class="topbar-inner topbar-inner-wide">
        <a href="/" class="brand" aria-label="SignBridge Home">
          <img src="/static/assets/logo.svg" alt="" class="brand-mark" width="24" height="24" />
          <span class="brand-name">SignBridge</span>
        </a>

        <nav class="topnav" aria-label="Primary navigation">
          <a href="/" class="nav-link">Translate</a>
          <a href="/#recent-jobs" class="nav-link">Recent videos</a>
        </nav>

        <div class="topbar-actions">
          <a href="/" class="btn btn-primary btn-sm">New video</a>
        </div>
      </div>
    </header>

    <main class="player-workspace">
      <div id="player-error-banner" class="inline-alert inline-alert-error hidden" role="alert"></div>

      <div id="workspace-grid" class="workspace-grid">
        <section class="video-column" aria-label="Video playback">
          <div id="stage-container" class="stage-container layout-pip">
            <div class="primary-video-wrap">
              <video
                id="original-video"
                class="primary-video"
                preload="metadata"
                playsinline
              ></video>

              <div
                id="interpreter-window"
                class="interpreter-window"
                aria-label="ASL Interpreter Window"
              >
                <div id="interpreter-drag-handle" class="interpreter-topbar" title="Drag to move">
                  <span class="interpreter-label">ASL Interpreter</span>
                  <span class="interpreter-grip" aria-hidden="true">⋮⋮</span>
                </div>
                <video
                  id="interpreter-video"
                  class="interpreter-video hidden"
                  preload="auto"
                  muted
                  playsinline
                ></video>
                <div id="interpreter-placeholder" class="interpreter-fallback">
                  <p class="interpreter-fallback-title">Interpreter unavailable</p>
                  <p id="interpreter-live-caption" class="interpreter-live-caption">
                    No compiled ASL track for this video.
                  </p>
                </div>
                <button
                  type="button"
                  id="interpreter-resize-handle"
                  class="interpreter-resize-handle"
                  aria-label="Resize interpreter window"
                  title="Drag to resize"
                ></button>
              </div>
            </div>
          </div>

          <div class="controls-bar" role="group" aria-label="Video player controls">
            <button
              type="button"
              id="play-pause-btn"
              class="icon-btn icon-btn-primary"
              aria-label="Play"
              title="Play"
            >
              <svg id="play-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M8 5.5v13l11-6.5-11-6.5z" />
              </svg>
              <svg id="pause-icon" class="hidden" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M7 5h3.5v14H7V5zm6.5 0H17v14h-3.5V5z" />
              </svg>
            </button>

            <span id="time-readout" class="time-readout mono tabular">00:00 / 00:00</span>

            <label for="seek-slider" class="sr-only">Seek timeline</label>
            <input
              id="seek-slider"
              type="range"
              min="0"
              max="100"
              step="0.05"
              value="0"
              class="seek-slider"
            />

            <div class="volume-group">
              <button
                type="button"
                id="mute-btn"
                class="icon-btn"
                aria-label="Mute"
                title="Mute"
              >
                <svg id="volume-on-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                  <path d="M11 5L6 9H2v6h4l5 4V5z" stroke-linejoin="round" />
                  <path d="M15.5 8.5a5 5 0 0 1 0 7" stroke-linecap="round" />
                  <path d="M18.5 5.5a9 9 0 0 1 0 13" stroke-linecap="round" />
                </svg>
                <svg id="volume-off-icon" class="hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                  <path d="M11 5L6 9H2v6h4l5 4V5z" stroke-linejoin="round" />
                  <path d="M22 9l-6 6M16 9l6 6" stroke-linecap="round" />
                </svg>
              </button>
              <label for="volume-slider" class="sr-only">Volume</label>
              <input
                id="volume-slider"
                type="range"
                min="0"
                max="1"
                step="0.05"
                value="1"
                class="volume-slider"
              />
            </div>

            <label for="speed-select" class="sr-only">Playback speed</label>
            <select id="speed-select" class="speed-select" aria-label="Playback speed">
              <option value="0.75">0.75x</option>
              <option value="1" selected>1x</option>
              <option value="1.25">1.25x</option>
              <option value="1.5">1.5x</option>
              <option value="2">2x</option>
            </select>

            <button
              type="button"
              id="fullscreen-btn"
              class="icon-btn"
              aria-label="Toggle fullscreen"
              title="Fullscreen"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </button>
          </div>

          <div class="video-details">
            <div class="video-details-main">
              <h1 id="player-video-title" class="player-title">Loading video…</h1>
              <p id="player-video-meta" class="meta-line"></p>
            </div>

            <div class="player-view-actions">
              <button type="button" id="toggle-layout-btn" class="btn btn-ghost btn-sm">
                Side-by-Side
              </button>
              <button type="button" id="toggle-interpreter-btn" class="btn btn-ghost btn-sm">
                Hide interpreter
              </button>
              <button type="button" id="toggle-transcript-btn" class="btn btn-ghost btn-sm">
                Hide transcript
              </button>
            </div>
          </div>

          <div id="interpreter-status-bar" class="asl-active-line hidden" aria-live="polite">
            <span id="interpreter-gloss-readout" class="asl-active-text"></span>
          </div>
        </section>

        <aside id="transcript-panel" class="transcript-panel" aria-label="Transcript">
          <div class="transcript-panel-header">
            <div>
              <h2 class="transcript-heading">Transcript</h2>
              <p id="transcript-summary" class="meta-line">Loading…</p>
            </div>
            <div class="transcript-export-actions">
              <button type="button" id="copy-transcript-btn" class="text-action-btn">
                Copy
              </button>
              <span class="meta-sep" aria-hidden="true">·</span>
              <button type="button" id="download-json-btn" class="text-action-btn">
                Export JSON
              </button>
            </div>
          </div>

          <div class="transcript-search-wrap">
            <label for="transcript-search" class="sr-only">Search transcript</label>
            <input
              id="transcript-search"
              type="search"
              placeholder="Search spoken words…"
              class="text-input text-input-sm"
            />
          </div>

          <div id="transcript-list" class="transcript-list" role="list">
            <p class="empty-state">Loading transcript…</p>
          </div>
        </aside>
      </div>
    </main>

    <footer class="site-footer">
      <div class="footer-bar footer-bar-wide">
        <div class="footer-copy">© 2026 SignBridge. All rights reserved.</div>
        <div class="footer-meta">Made by SignBridge · ASL clips via WLASL</div>
      </div>
    </footer>

    <script src="/static/js/transcript.js"></script>
    <script src="/static/js/player.js"></script>
  </body>
</html>
